# Infrastructure for running the backend locally: MySQL, MongoDB, Redis and Kafka.
# The Spring Boot services run on your machine and connect to these on localhost.
#
#   cp .env.example .env    # then fill in your own passwords
#   docker compose up -d
#
# The databases user_service and url_service are created by the services themselves
# (createDatabaseIfNotExist=true in their JDBC URLs).

services:
    mysql:
        image: mysql:8.4
        container_name: url_structured_db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - url_network

    mongodb:
        image: mongo:8.0
        container_name: url_unstructured_db
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env (see .env.example)}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env (see .env.example)}
        ports:
            - "27017:27017"
        volumes:
            - mongo-data:/data/db
            - mongo-config:/data/configdb
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - url_network

    redis:
        image: redis:8.8.0-alpine
        container_name: url_cache
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - cache-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - url_network

    kafka:
        image: apache/kafka:4.2.1
        container_name: url_events
        restart: unless-stopped
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            # Listen on all interfaces inside the container. PLAINTEXT is for other
            # containers (kafka:29092), PLAINTEXT_HOST is for apps on your machine (localhost:9092).
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_LOG_DIRS: /var/lib/kafka/data
        volumes:
            - kafka-data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 20s
        networks:
            - url_network

networks:
    url_network:
        driver: bridge

volumes:
    mysql-data:
    mongo-data:
    mongo-config:
    cache-data:
    kafka-data:
