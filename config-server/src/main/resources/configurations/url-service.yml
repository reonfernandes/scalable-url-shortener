server:
    port: 8101

spring:
    datasource:
        # createDatabaseIfNotExist: MySQL creates the url_service database on the first start
        url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/url_service?createDatabaseIfNotExist=true
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_ROOT_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            database: 0
            timeout: 2000ms

            lettuce:
                pool:
                    max-active: 20
                    max-idle: 8
                    min-idle: 2
                    max-wait: 1000ms
    kafka:
        # shared by the producer, the consumer and the topic creator (KafkaAdmin)
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            properties:
                # if Kafka is down, give up on a click event after 2s (default 60s), so the visitor isn't kept waiting
                max.block.ms: 2000
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            # ErrorHandlingDeserializer skips a message that can't be read instead of failing on it forever
            value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
            group-id: url-service-group
            auto-offset-reset: earliest
            enable-auto-commit: true
            properties:
                spring:
                    deserializer:
                        value:
                            delegate:
                                class: org.springframework.kafka.support.serializer.JsonDeserializer
                    json:
                        trusted:
                            packages: com.reon.events


eureka:
    client:
        service-url:
            defaultZone: http://localhost:8500/eureka/
    instance:
        prefer-ip-address: true

security:
    gateway:
        # Must match the API gateway's; requests without it are rejected (GatewayOnlyFilter)
        secret: ${GATEWAY_SECRET}
    app:
        url:
            base-url: ${SHORT_URL_BASE:http://localhost:8080}
        ui:
            # Visitors opening a password-protected link are sent to <base-url>/unlock/<code>
            base-url: ${UI_BASE_URL:http://localhost:5173}
        cache:
            url-ttl-minutes: 15