server:
    port: 8080

spring:
    # Redis: rate limiting and the list of cancelled tokens
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            timeout: 2000ms
    cloud:
        gateway:
            server:
                webflux:
                    default-filters: [ ]
                    discovery:
                        locator:
                            enabled: false

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8500/eureka/
    instance:
        prefer-ip-address: true


security:
    jwt:
        secret-key: ${JWT_SECRET}
    cookie:
        name: accessToken
    gateway:
        # Sent to every service in X-Gateway-Secret; services reject requests without it
        secret: ${GATEWAY_SECRET}