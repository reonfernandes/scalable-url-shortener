server:
    port: 8103

spring:
    mongodb:
        host: ${MONGO_HOST:localhost}
        port: ${MONGO_PORT:27017}
        database: ${MONGO_DATABASE:analytics}
        authentication-database: admin
    kafka:
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            # ErrorHandlingDeserializer skips a message that can't be read instead of failing on it forever
            value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
            bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
            group-id: analytics-service-group
            auto-offset-reset: earliest
            enable-auto-commit: true
            properties:
                spring:
                    deserializer:
                        value:
                            delegate:
                                class: org.springframework.kafka.support.serializer.JsonDeserializer
                    json:
                        trusted:
                            packages: com.reon.events
eureka:
    client:
        service-url:
            defaultZone: http://localhost:8500/eureka/
    instance:
        prefer-ip-address: true

security:
    gateway:
        # Must match the API gateway's; requests without it are rejected (GatewayOnlyFilter)
        secret: ${GATEWAY_SECRET}
