server:
    port: 8100

spring:
    datasource:
        # createDatabaseIfNotExist: MySQL creates the user_service database on the first start
        url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/user_service?createDatabaseIfNotExist=true
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_ROOT_PASSWORD}
    jpa:
        hibernate:
            # update: Hibernate changes the tables to match the entities (fine for development).
            # For production set JPA_DDL_AUTO=validate and change the tables yourself.
            ddl-auto: ${JPA_DDL_AUTO:update}
        # true prints every SQL query; handy while debugging, too noisy otherwise
        show-sql: ${JPA_SHOW_SQL:false}
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true
    kafka:
        # shared by the producer and the topic creator (KafkaAdmin)
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all
            retries: 3
    # Redis holds the list of cancelled tokens that the gateway checks
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            timeout: 2000ms

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8500/eureka/
    instance:
        prefer-ip-address: true

security:
    gateway:
        # Must match the API gateway's; requests without it are rejected (GatewayOnlyFilter)
        secret: ${GATEWAY_SECRET}
    jwt:
        secret-key: ${JWT_SECRET}
        expiration-time: 3600
        issuer: microurl.ly
    cookie:
        name: accessToken
        expiration-time: 3600
    kafka:
        topic:
            deleted: user.deleted
            admin:
                userState: user.state
